<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latent - The film camera on your iPhone</title>
  <meta name="description" content="Hand-tuned film looks applied live in the viewfinder. On your iPhone. One-time payment, no subscription.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #F2E6D0;
      --panel-cream: #FBF3E3;
      --text-primary: #4A3826;
      --text-muted: #8C7658;
      --accent-mustard: #D9A441;
      --accent-mustard-dark: #A5691E;
      --accent-terracotta: #C1583F;
      --border-warm: #B89A6B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg-cream); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .container { max-width: 560px; margin: 0 auto; text-align: center; }
    .wordmark {
      font-family: 'IBM Plex Sans Condensed', sans-serif;
      font-weight: 700;
      font-size: 32px;
      letter-spacing: 3px;
      text-transform: uppercase;
      display: inline-block;
      color: var(--text-primary);
      border-bottom: 4px solid var(--accent-mustard);
      padding-bottom: 6px;
      margin-bottom: 24px;
    }
    .rule {
      width: 40px;
      height: 2px;
      background: var(--border-warm);
      margin: 32px auto;
    }
    .eyebrow {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--accent-mustard-dark);
      margin-bottom: 18px;
    }
    h1 {
      font-family: 'IBM Plex Sans Condensed', sans-serif;
      font-weight: 700;
      font-size: 44px;
      letter-spacing: 0.4px;
      line-height: 1.1;
      margin-bottom: 20px;
    }
    .subhead {
      font-size: 18px;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 460px;
      margin: 0 auto 40px;
    }
    .subhead strong { color: var(--text-primary); font-weight: 600; }
    .links {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .links a {
      color: var(--text-muted);
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      margin: 0 12px;
    }
    .links a:hover { color: var(--accent-terracotta); }
    .coming-soon {
      margin-top: 40px;
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    @media (max-width: 480px) {
      h1 { font-size: 34px; }
      .subhead { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="wordmark">Latent</div>

    <div class="eyebrow">The film camera on your iPhone</div>
    <h1>Shoot on film. Live in the viewfinder.</h1>
    <p class="subhead">
      Hand-tuned film looks applied live in the viewfinder. The <strong>color</strong>, <strong>grain</strong>, and <strong>glow</strong> happen while you shoot, not after.
    </p>

    <div class="rule"></div>

    <div class="links">
      <a href="./privacy.html">Privacy</a>
      <a href="./support.html">Support</a>
    </div>

    <div class="coming-soon">Full site coming soon</div>
  </div>
</body>
</html>
